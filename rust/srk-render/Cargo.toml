[package]
name = "srk-render"
version = "0.1.0"
edition = "2021"
description = "Straßenraumkarte PostGIS → XYZ raster tile renderer (Rust; full-approx + highway_area isolate)"
publish = false

[[bin]]
name = "srk-render"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
geo-types = "0.7"
postgres = "0.19"
tiny-skia = "0.12"
webp = "0.3"
wkb = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
resvg = "0.44"
ttf-parser = "0.24"
