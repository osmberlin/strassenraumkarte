# PostgreSQL tuning for Straßenraumkarte OSM import + PostGIS SQL processing.
# Sized for a ~24 GB / 10-core host without starving Docker Desktop / macOS.
# Inspired by osm2pgsql recommendations:
# https://osm2pgsql.org/doc/manual.html#tuning-the-postgresql-server

listen_addresses = '*'

# Memory
shared_buffers = 2GB
work_mem = 128MB
maintenance_work_mem = 1GB
effective_cache_size = 6GB

# Parallelism (PostGIS processing benefits; leave headroom for osm2pgsql / host)
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# WAL / checkpoints — favour bulk load throughput over crash-recovery granularity
wal_level = minimal
max_wal_senders = 0
max_wal_size = 4GB
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9

# Planner: SSD-friendly
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging (keep quiet during long imports)
log_min_duration_statement = 5000
